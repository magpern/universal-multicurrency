name: CI

on:
  push:
    branches: [main]
  pull_request:

# WordPress core is pinned to the installed wp-phpunit version by
# tests/bin/install-wp.sh. WooCommerce is pinned explicitly below: the Store API
# suite asserts response shapes, and an unpinned "latest" resolves to
# pre-release builds whose changes would surface as unrelated CI failures.
# The minimum-supported-version matrix (PHP 8.1 / WP 6.5 / WC 8.2) remains a
# later hardening milestone.
env:
  WC_VERSION: '10.9.4'

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: composer phpcs

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: composer test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_DB_HOST: 127.0.0.1
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASS: root
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: bash tests/bin/install-wp.sh
      - run: composer test:integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader
      - run: bash bin/build-zip.sh
      - uses: actions/upload-artifact@v5
        with:
          name: universal-multicurrency
          path: dist/universal-multicurrency-*.zip
